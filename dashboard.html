<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard CECTAP</title>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
      overflow: hidden;
      position: relative;
      background-color: #0f172a;
    }

    .bg-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('mosaico.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -2;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.05);
      z-index: -1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 12px 24px;
      margin-bottom: 15px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
    }

    .weather-widget {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 16px;
      border-radius: 12px;
    }

    .clock-widget {
      text-align: right;
    }

    .clock-time {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .clock-date {
      font-size: 0.85rem;
      color: #cbd5e1;
      text-transform: capitalize;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .main-container {
      flex: 1;
      background: rgba(15, 23, 42, 0.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    #calendar {
      flex: 1;
      height: 100%;
    }

    .fc {
      color: #f8fafc;
    }
    .fc-theme-standard td, .fc-theme-standard th {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.1);
    }
    .fc-theme-standard th {
      background: rgba(15, 23, 42, 0.3);
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    .fc-toolbar-title {
      font-size: 1.5rem !important;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    .fc-button-primary {
      background-color: rgba(255, 255, 255, 0.15) !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      color: #fff !important;
      border-radius: 8px !important;
      transition: all 0.2s;
    }
    .fc-button-primary:hover {
      background-color: rgba(255, 255, 255, 0.3) !important;
    }
    .fc-daygrid-day {
      cursor: pointer;
      transition: background 0.2s;
    }
    .fc-daygrid-day:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .fc-daygrid-day-number {
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      font-weight: 600;
    }
    .fc-event {
      background: #2563eb !important;
      border: none !important;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.85rem;
    }

    .custom-selectors {
      display: inline-flex;
      gap: 8px;
      margin-left: 10px;
    }

    .custom-select {
      background: rgba(15, 23, 42, 0.6);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px;
      width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #f8fafc;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="bg-background"></div>
  <div class="bg-overlay"></div>

  <div class="top-bar">
    <div class="weather-widget">
      <span id="weatherIcon">☀️</span>
      <div>
        <div id="weatherTemp" style="font-weight: 600;">18°C</div>
        <div id="weatherDesc" style="font-size: 0.75rem; color: #cbd5e1;">Santiago</div>
      </div>
    </div>

    <div class="clock-widget">
      <div id="clockTime" class="clock-time">00:00:00</div>
      <div id="clockDate" class="clock-date">Cargando fecha...</div>
    </div>
  </div>

  <div class="main-container">
    <div id="calendar"></div>
  </div>

  <div id="eventModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">Nueva Actividad CECTAP</div>
      
      <div class="form-group">
        <label for="eventTitle">Título de la Actividad</label>
        <input type="text" id="eventTitle" placeholder="Ej: Reunión de Coordinación">
      </div>

      <div class="form-group">
        <label for="eventDate">Fecha</label>
        <input type="date" id="eventDate">
      </div>

      <div class="form-group">
        <label for="eventDesc">Descripción (Opcional)</label>
        <textarea id="eventDesc" rows="3" placeholder="Detalles de la reunión..."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button id="btnSaveEvent" class="btn btn-primary" onclick="saveEvent()">Guardar Actividad</button>
      </div>
    </div>
  </div>

  <script>
    let calendar;

    function updateClock() {
      const now = new Date();
      document.getElementById('clockTime').innerText = now.toLocaleTimeString('es-CL');
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('clockDate').innerText = now.toLocaleDateString('es-CL', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getStoredEvents() {
      const stored = localStorage.getItem('cectap_events');
      return stored ? JSON.parse(stored) : [];
    }

    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'es',
        headerToolbar: {
          left: 'title prev,next today',
          center: '',
          right: ''
        },
        events: function(fetchInfo, successCallback, failureCallback) {
          successCallback(getStoredEvents());
        },
        dateClick: function(info) {
          openModal(info.dateStr);
        }
      });

      calendar.render();
      injectCustomSelectors();
    });

    function injectCustomSelectors() {
      const toolbarRight = document.querySelector('.fc-toolbar-chunk:last-child');
      if (!toolbarRight) return;

      const selectorsContainer = document.createElement('div');
      selectorsContainer.className = 'custom-selectors';

      const monthSelect = document.createElement('select');
      monthSelect.className = 'custom-select';
      const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      months.forEach((m, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = m;
        if (idx === new Date().getMonth()) opt.selected = true;
        monthSelect.appendChild(opt);
      });

      const yearSelect = document.createElement('select');
      yearSelect.className = 'custom-select';
      const currentYear = new Date().getFullYear();
      for (let y = currentYear - 2; y <= currentYear + 5; y++) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.innerText = y;
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      function handleDateChange() {
        const year = parseInt(yearSelect.value);
        const month = parseInt(monthSelect.value);
        calendar.gotoDate(new Date(year, month, 1));
      }

      monthSelect.addEventListener('change', handleDateChange);
      yearSelect.addEventListener('change', handleDateChange);

      selectorsContainer.appendChild(monthSelect);
      selectorsContainer.appendChild(yearSelect);
      toolbarRight.appendChild(selectorsContainer);
    }

    function openModal(dateStr) {
      document.getElementById('eventDate').value = dateStr;
      document.getElementById('eventTitle').value = '';
      document.getElementById('eventDesc').value = '';
      document.getElementById('eventModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('eventModal').style.display = 'none';
    }

    function saveEvent() {
      const title = document.getElementById('eventTitle').value;
      const date = document.getElementById('eventDate').value;
      const desc = document.getElementById('eventDesc').value;

      if (!title) {
        alert('Por favor ingrese un título para la actividad');
        return;
      }

      const events = getStoredEvents();
      events.push({
        title: title,
        start: date,
        description: desc
      });

      localStorage.setItem('cectap_events', JSON.stringify(events));

      closeModal();
      calendar.refetchEvents();
    }
  </script>
</body>
</html>
